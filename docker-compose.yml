version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql-tienda-juegos
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tienda_juegos_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Esto ejecutará automáticamente un archivo .sql para crear tus tablas al iniciar
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

volumes:
  db_data: