<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea tu Cuenta</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="body-login body-registro">

<header class="header-login">
    <h1 class="logo-texto">GENESIS</h1>
</header>

<main class="contenedor-pantalla">
    <form id="formRegistro" class="tarjeta-login form-registro-completo">
        
        <section class="login-izquierda seccion-inputs-registro">
            <h2 class="titulo-registro">Crea tu cuenta</h2>
            <div class="grid-campos">
                <div class="input-grupo">
                    <label for="reg-usuario">Nombre De Usuario</label>
                    <input type="text" id="reg-usuario" class="input-oscuro" placeholder="Patata" required>
                </div>
                <div class="input-grupo">
                    <label for="reg-email">Correo Electronico</label>
                    <input type="email" id="reg-email" class="input-oscuro" placeholder="Tu@Email.Com" required>
                </div>
                <div class="input-grupo">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" class="input-oscuro" placeholder="***********" required>
                </div>
                <div class="input-grupo">
                    <label for="reg-password-confirm">Confirmar Contraseña</label>
                    <input type="password" id="reg-password-confirm" class="input-oscuro" placeholder="***********" required>
                </div>
            </div>
            
            <button type="button" class="btn-interactivo btn-secundario btn-nav-registro solo-movil" onclick="window.location.href='index.html'">Iniciar Sesion</button>
        </section>

        <section class="login-derecha seccion-promo-registro solo-movil">
            <h2 class="texto-promocional">Metete Al Vicio Papi,<br>Es Gratis</h2>
            <button type="submit" class="btn-interactivo btn-primario btn-submit-registro">Registrarse</button>
        </section>
        
        <div class="pie-registro oculto-movil">
            <a href="index.html" class="link-volver">¿Ya tienes cuenta? Inicia sesión</a>
            <button type="submit" class="btn-interactivo btn-primario">Registrarse</button>
        </div>
    </form>
</main>
<script src="js/registro.js"></script>
</body>
</html>
