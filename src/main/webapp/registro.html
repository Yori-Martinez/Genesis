<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea tu Cuenta</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="body-login body-registro">

<header class="header-login">
    <h1 class="logo-texto">icono</h1>
</header>

<main class="contenedor-pantalla">
    <div class="tarjeta-login">
        <form id="formRegistro" class="form-registro-completo">
            <h2 class="titulo-registro">Crea tu cuenta</h2>

            <div class="grid-campos">
                <div class="input-grupo">
                    <label for="reg-usuario">Nombre De Usuario</label>
                    <input type="text" id="reg-usuario" class="input-oscuro" placeholder="Patata">
                </div>
                <div class="input-grupo">
                    <label for="reg-email">Correo Electrónico</label>
                    <input type="email" id="reg-email" class="input-oscuro" placeholder="tu@email.com">
                </div>
                <div class="input-grupo">
                    <label for="reg-password">Contraseña</label>
                    <input type="password" id="reg-password" class="input-oscuro" placeholder="********">
                </div>
                <div class="input-grupo">
                    <label for="reg-password-confirm">Confirmar Contraseña</label>
                    <input type="password" id="reg-password-confirm" class="input-oscuro" placeholder="********">
                </div>
            </div>

            <div class="pie-registro">
                <a href="index.html" class="link-volver">¿Ya tienes cuenta? Inicia sesión</a>
                <button type="submit" class="btn-interactivo btn-primario">Registrarse</button>
            </div>
        </form>
    </div>
</main>
<script src="js/registro.js"></script>
</body>
</html>
