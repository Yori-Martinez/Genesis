<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Videojuegos</title>
    <link rel="stylesheet" href="css/tienda.css">
</head>
<body class="body-biblioteca">

<header class="header">
    <h1 class="logo">icono</h1>
    <nav class="nav" id="menu-principal">
        <a href="tienda.html" class="link active">Tienda</a>
        <a href="biblioteca.html" class="link">Biblioteca</a>
        <a href="editor.html" class="link req-editor" style="display: none;">Subir Juego</a>
        <a href="mis_publicaciones.html" class="link req-editor" style="display: none;">Mis Publicaciones</a>
        <a href="lista_revision.html" class="link req-admin" style="display: none;">Revision</a>
    </nav>
    <div class="user-slot">
        <span id="username" class="user-name">Invitado</span>
        <div class="user-avatar"></div>
    </div>
</header>

<main class="layout-tienda" style="display: flex; flex-direction: column; width: 100%;">
    <section class="hero" id="hero-banner" style="background-size: cover; background-position: center; transition: background-image 0.5s ease;">
        <div class="overlay-hero" style="padding-left: 4.375rem; display: flex; flex-direction: column; justify-content: center;">
            <h1 id="hero-titulo" style="color: #FFF; font-size: 3.5rem; font-family: 'Kokoro', sans-serif; text-shadow: 2px 2px 10px rgba(0,0,0,0.8);">Cargando Novedades...</h1>
            <p id="hero-desc" style="color: rgba(255,255,255,0.9); font-size: 1.5rem; max-width: 50%; margin-top: 1rem; text-shadow: 1px 1px 5px rgba(0,0,0,0.8);">Buscando el último lanzamiento en la base de datos...</p>
            <button id="hero-btn-carrito" class="btn btn-hero">Al Carrito</button>
        </div>
    </section>

    <section class="destacados">
        <h2 style="color: #FFFFFF; font-size: 2.5rem; font-family: 'Kokoro', sans-serif; margin: 3rem 0 1.5rem 4.375rem; text-transform: lowercase;">destacados</h2>
        <div class="grid-tienda" id="grid-tienda" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.75rem; margin: 0 4.375rem 4rem 4.375rem;">
        </div>
    </section>
</main>

<script src="js/auth.js"></script>
<script src="js/tienda.js"></script>
</body>
</html>
