<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda de Videojuegos</title>
    <link rel="stylesheet" href="css/tienda.css">
</head>
<body class="tienda">

<header class="header">
    <h1 class="logo">GENESIS</h1>
    <nav class="nav" id="menu-principal">
        <a href="tienda.html" class="link active">Tienda</a>
        <a href="biblioteca.html" class="link">Biblioteca</a>
        <a href="editor.html" class="link req-editor" style="display: none;">Subir Juego</a>
        <a href="mis_publicaciones.html" class="link req-editor" style="display: none;">Mis Publicaciones</a>
        <a href="lista_revision.html" class="link req-admin" style="display: none;">Revision</a>
    </nav>
    <div class="user-slot">
        <span id="username" class="user-name">Invitado</span>
        <div class="user-avatar"></div>
    </div>
</header>

<main class="layout-tienda" style="display: flex; flex-direction: column; width: 100%;">
    <section class="hero" id="hero-banner">
        <div class="overlay-hero">
            <h1 id="hero-titulo">Cargando Novedades...</h1>
            <p id="hero-desc">Buscando el último lanzamiento en la base de datos...</p>
            <button id="hero-btn-carrito" class="btn btn-hero">Al Carrito</button>
        </div>
    </section>

    <section class="descubrir">
        <h2 class="titulo-destacados">destacados</h2>

        <div class="grid-destacados" id="grid-destacados">
        </div>
    </section>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/tienda.js"></script>
</body>
</html>
